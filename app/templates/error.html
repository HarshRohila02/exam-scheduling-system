{% extends "base.html" %}
{% block title %}Error{% endblock %}
{% block content %}
<div class="text-center mt-5">
  <h1 class="display-5">{{ error.code }}</h1>
  <p class="lead">{{ error.description }}</p>
  {% if session.get('role') == 'STUDENT' %}
    <a class="btn btn-primary" href="{{ url_for('student.dashboard') }}">Back to dashboard</a>
  {% else %}
    <a class="btn btn-primary" href="{{ url_for('dashboard.index') }}">Back to dashboard</a>
  {% endif %}
</div>
{% endblock %}
