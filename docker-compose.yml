# Starts a MySQL 8 server for the Admin Portal:  docker compose up -d
services:
  db:
    image: mysql:8.4
    container_name: aemss-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: aemss
      MYSQL_USER: aemss
      MYSQL_PASSWORD: aemss_pass
    ports:
      - "3306:3306"
    volumes:
      - aemss_data:/var/lib/mysql

volumes:
  aemss_data:
